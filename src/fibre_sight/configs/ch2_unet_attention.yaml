# Created on 2 August 2026
# attention-gated skip connections with the working 256-pixel recipe
data:
  manifest: manifests/ch2_manifest.csv
  train_split: train
  val_split: val
  patch_size: 256
  patches_per_image: 24
  val_patches_per_image: 8
  foreground_fraction: 0.75
  normalise_percentiles: [1, 99.7]
  cache_images: true
  # 1 August 2026: preserve the augmentation used by the released checkpoint.
  augmentation:
    rotation_90: true
    noise_sd: 0.02

model:
  in_channels: 1
  out_channels: 1
  base_channels: 24
  depth: 4
  attention_gates: true

# 2 August 2026: change the skip paths only; keep the working loss fixed.
loss:
  mode: bce_dice
  bce_weight: 1.0
  seg_weight: 1.0

train:
  run_name: ch2_unet_attention
  out_dir: output/runs
  epochs: 80
  batch_size: 8
  learning_rate: 0.0003
  weight_decay: 0.00001
  num_workers: 0
  pin_memory: true
  amp: true
  seed: 7
  device: auto

postprocess:
  threshold: 0.5
  min_size: 30
  max_size:
