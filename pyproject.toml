[build-system]
requires = ['setuptools>=77', 'wheel']
build-backend = 'setuptools.build_meta'

[project]
name = 'fibre-sight'
version = '0.1.3'
description = 'Channel-2 axon ROI prediction and curation workbench'
readme = 'README.md'
license = 'MIT'
license-files = ['LICENSE']
requires-python = '>=3.10'
authors = [
  {name = 'Dinghao Luo'},
]
classifiers = [
  'Intended Audience :: Science/Research',
  'Programming Language :: Python :: 3',
  'Topic :: Scientific/Engineering :: Image Processing',
]
dependencies = [
  'matplotlib>=3.7',
  'numpy>=1.24',
  'opencv-python>=4.8',
  'pynwb>=4.1',
  'PyQt5>=5.15',
  'PyYAML>=6.0',
  'scikit-image>=0.21',
  'scipy>=1.10',
  'torch>=2.3',
  'tifffile>=2024.2',
  'tqdm>=4.66',
]

[project.gui-scripts]
fibre-sight = 'fibre_sight.gui:main'

[project.scripts]
fibre-sight-build-manifest = 'fibre_sight.build_manifest:main'
fibre-sight-evaluate = 'fibre_sight.evaluate:main'
fibre-sight-predict = 'fibre_sight.predict_rois:main'
fibre-sight-train = 'fibre_sight.train_unet:main'

[tool.setuptools]
package-dir = {'' = 'src'}
include-package-data = true

[tool.setuptools.packages.find]
where = ['src']

[tool.setuptools.package-data]
fibre_sight = [
  'assets/*.ico',
  'assets/fonts/mononoki/*.ttf',
  'assets/fonts/mononoki/LICENSE',
  'assets/fonts/mononoki/README.md',
  'configs/*.yaml',
  'models/*.pt',
]
