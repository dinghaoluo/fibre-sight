[build-system]
requires = ['setuptools>=77', 'wheel']
build-backend = 'setuptools.build_meta'

[project]
name = 'fibre-sight'
version = '0.2.0'
description = 'End-to-end two-photon axon imaging analysis with registration, U-Net ROI segmentation, curation, fluorescence extraction, and dF/F calculation'
readme = 'README.md'
license = 'MIT'
license-files = ['LICENSE']
requires-python = '>=3.10'
authors = [
  {name = 'Dinghao Luo'},
]
classifiers = [
  'Intended Audience :: Science/Research',
  'Programming Language :: Python :: 3',
  'Topic :: Scientific/Engineering :: Image Processing',
]
dependencies = [
  'matplotlib>=3.7',
  'numpy>=1.24',
  'opencv-python>=4.8',
  'pandas>=2.0',
  'pynwb>=4.1',
  'PyQt5>=5.15',
  'PyYAML>=6.0',
  'scikit-image>=0.21',
  'scipy>=1.10',
  'torch>=2.3',
  'tifffile>=2024.2',
  'tqdm>=4.66',
]

[project.gui-scripts]
fibre-sight = 'fibre_sight.gui:main'

[project.scripts]
auto = 'fibre_sight.gui_worker:main'
build-manifest = 'fibre_sight.build_manifest:main'
dff = 'fibre_sight.stage_cli:dff_main'
evaluate = 'fibre_sight.evaluate:main'
fluorescence = 'fibre_sight.stage_cli:fluorescence_main'
list-runs = 'fibre_sight.list_runs:main'
plot-traces = 'fibre_sight.plot_traces:main'
predict = 'fibre_sight.predict_rois:main'
registration = 'fibre_sight.registration_cli:main'
segment = 'fibre_sight.stage_cli:segment_main'
train = 'fibre_sight.train_unet:main'

[tool.setuptools]
package-dir = {'' = 'src'}
include-package-data = true

[tool.setuptools.packages.find]
where = ['src']

[tool.setuptools.package-data]
fibre_sight = [
  'assets/*.ico',
  'assets/fonts/mononoki/*.ttf',
  'assets/fonts/mononoki/LICENSE',
  'assets/fonts/mononoki/README.md',
  'configs/*.yaml',
  'models/*.pt',
]
